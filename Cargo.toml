[package]
name = "vibe-commit-msg"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
lexopt = "0.3.2"
rig-core = { version = "0.36.0", default-features = false, features = ["reqwest", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
